name: Build & run tests

on: [push]

env:
  TEST_RESULTS_DIR: test-output
  SLN_FILE: domaineer.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
          
      - name: Install dependencies
        run: dotnet restore ${{ env.SLN_FILE }}
      - name: Build
        run: dotnet build --no-restore ${{ env.SLN_FILE }}
      - name: Test
        run: dotnet test --no-build --logger trx --results-directory ${{ env.TEST_RESULTS_DIR }} ${{ env.SLN_FILE }}
        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-output
        if: ${{ always() }}
