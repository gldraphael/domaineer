name: push-chart

on:
  push:
    branches:
      - '**'
    tags:
      - v*

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.1

      - name: Log in to the Container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Chart version: $VERSION"
          else
            echo "Not a tag push, skipping version extraction"
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Update Chart.yaml with version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.get_version.outputs.version }}/" ./chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.get_version.outputs.version }}\"/" ./chart/Chart.yaml
          cat ./chart/Chart.yaml

      - name: Validate Helm chart (dry-run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          helm lint chart
          helm package chart --dry-run
          echo "Helm chart validation successful (dry-run mode)"

      - name: Publish Helm chart to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm package chart
          helm push domaineer-${{ steps.get_version.outputs.version }}.tgz oci://${{ env.REGISTRY }}/gldraphael/charts
          rm domaineer-${{ steps.get_version.outputs.version }}.tgz
